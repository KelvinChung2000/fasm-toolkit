repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/allganize/ty-pre-commit
    rev: v0.0.18
    hooks:
      - id: ty-check
        files: ^src/
        # ty runs in an isolated env; give it the runtime deps so it can
        # resolve third-party imports (lark, typer, loguru).
        additional_dependencies: [lark, typer, loguru]
