[project]
name = "fasm-toolkit"
version = "0.1.0"
description = "A modern FPGA Assembly (FASM) parser and manipulation toolkit, built on Lark with a typed IR"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "lark>=1.1",
    "typer>=0.12",
    "loguru>=0.7",
]

[project.scripts]
fasm-toolkit = "fasm_toolkit.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fasm_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
